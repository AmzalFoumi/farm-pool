# FARM-26 — a buyer places an order and pins where it should be delivered.
#
# This is the flow that found two bugs by hand, neither of which `tsc` or 178 unit tests saw: the
# sheet crashed on open (a `useAuth()` inside a portal, outside AuthProvider), and the map drew a
# blank white box on iOS (Expo Go ships no Google Maps iOS SDK). Both are held down here.
#
# `appId` is Expo Go's, not ours: under Expo Go the app has no bundle id of its own. See README.
appId: host.exp.Exponent
---
- openLink: exp://127.0.0.1:8081/--/listings
- extendedWaitUntil:
    visible: "Listings"
    timeout: 30000

# Open whichever listing is first — see the sibling flow for why this is not a crop name.
- tapOn:
    id: "listing-card"
    index: 0
- extendedWaitUntil:
    visible:
      id: "open-place-order"
    timeout: 15000
- tapOn:
    id: "open-place-order"
- extendedWaitUntil:
    visible:
      id: "order-quantity"
    timeout: 10000

# The quantity field is deliberately not touched, and the reason is worth knowing: focusing it
# raises the number pad, which covers the whole footer of the sheet. Every tap aimed below it then
# lands on a key instead — a tap on "pin the delivery point" typed a 5 into the quantity — while
# Maestro still reports the tap COMPLETED. The pad cannot be dismissed either: `hideKeyboard` is
# unsupported on iOS, and its own "Done" fires `onSubmitEditing`, which sends the order.
#
# So this flow leaves the pre-filled minimum alone and keeps the keyboard down. Quantity entry is
# a separate concern, covered by `enter-quantity.yaml`.
- tapOn:
    id: "delivery-pin"

# The map actually draws. This is the assertion that fails when the provider is wrong — a blank
# white box still occupies the layout, so only a real tile check catches it.
- extendedWaitUntil:
    visible:
      id: "point-picker-map"
    timeout: 10000

# Tapping the map drops a pin. Proof is the Clear button, which exists only once a point is set.
- tapOn:
    id: "point-picker-map"
- extendedWaitUntil:
    visible: "Clear"
    timeout: 5000

- takeScreenshot: pinned-delivery-point

# The open map makes the sheet taller than the screen, so Send is below the fold — it is on the
# page but not in the hierarchy until scrolled to.
- scrollUntilVisible:
    element:
      id: "order-send"
    direction: DOWN
- tapOn:
    id: "order-send"
- extendedWaitUntil:
    visible: "Requested"
    timeout: 20000
